[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bydtech-model-retire"
version = "0.1.1"
description = "Find deprecated, retiring and retired LLM model IDs in a codebase before a provider shuts them off."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "BYD Tech", email = "sales.bydtech@gmail.com" }]
keywords = ["llm", "deprecation", "model", "openai", "anthropic", "gemini", "vertex-ai", "bedrock", "mistral", "cohere", "scanner", "cli", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BYDTechSolutions/model-retire#readme"
Repository = "https://github.com/BYDTechSolutions/model-retire"
Issues = "https://github.com/BYDTechSolutions/model-retire/issues"

[project.scripts]
model-retire = "model_retire.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/model_retire"]

[tool.hatch.build.targets.sdist]
include = ["src/model_retire", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
